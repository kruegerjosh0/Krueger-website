backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "gallery"
    label: "Project Gallery"
    files:
      - file: "data/gallery.json"
        label: "Recent Projects"
        name: "gallery"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            fields:
              - {label: "Category Name", name: "title", widget: "string"}
              - label: "Photos"
                name: "photos"
                widget: "list"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Description (alt text)", name: "alt", widget: "string"}
                  - {label: "Tag (optional, e.g. BEFORE / AFTER)", name: "tag", widget: "string", required: false}
