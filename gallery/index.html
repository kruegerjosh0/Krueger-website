<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Krueger Painting</title>

    <!-- Netlify Identity Widget Script (used by the admin login) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Text and images marked with data-cms-* are editable from the admin page (/admin/) -->
    <header>
        <div class="logo-row">
            <a href="/">
                <img src="" alt="Logo" data-cms-src="settings.logo" hidden>
                <h1 data-cms="settings.business_name">Krueger Painting</h1>
            </a>
        </div>
        <div class="nav-links">
            <a href="/#services">Services</a>
            <a href="/gallery/">Gallery</a>
            <a href="/#estimate">Request Estimate</a>
        </div>
        <div class="action-buttons">
            <a href="tel:2623395822" class="btn-call" data-cms-tel="settings.phone">Call Now</a>
            <a href="https://facebook.com" target="_blank" rel="noopener" class="btn-fb" data-cms-href="settings.facebook_url">Facebook</a>
        </div>
    </header>

    <section class="container">
        <div class="section-title">
            <h3 data-cms="gallery.page_heading">Photo Gallery</h3>
            <div class="underline"></div>
        </div>
        <p class="page-intro" data-cms="gallery.page_intro">Browse our painting, drywall, and deck projects from around Washington County.</p>

        <!-- Filled from the Photo Gallery in the admin page -->
        <div id="filter-bar" class="filter-bar"></div>
        <div id="photo-grid" class="photo-grid"></div>

        <div style="text-align: center; margin-top: 40px;">
            <a href="/#estimate" class="btn-primary" style="margin: 0 auto;">Get Free Estimate</a>
        </div>
    </section>

    <div id="lightbox" class="lightbox" hidden>
        <button type="button" aria-label="Close">&times;</button>
        <img src="" alt="">
        <p></p>
    </div>

    <footer>
        <p data-cms="settings.footer_text">&copy; 2026 Krieger Painting DBA Krueger Painting. All rights reserved.</p>
        <a href="/admin/" class="admin-link">Admin Login</a>
    </footer>

    <script src="/js/site.js"></script>
</body>
</html>
