<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e242b"/>
      <stop offset="100%" stop-color="#0f1318"/>
    </linearGradient>
    <linearGradient id="cab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ecef"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd53d"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Kitchen Wall & Backsplash -->
  <rect x="60" y="50" width="680" height="480" rx="8" fill="#252c34" filter="url(#shadow)"/>
  
  <!-- Subtle subway tile pattern -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5">
    <line x1="60" y1="260" x2="740" y2="260"/>
    <line x1="60" y1="290" x2="740" y2="290"/>
    <line x1="60" y1="320" x2="740" y2="320"/>
    <line x1="60" y1="350" x2="740" y2="350"/>
  </g>

  <!-- Upper Cabinets (Fresh Painted White Finish) -->
  <rect x="90" y="80" width="180" height="170" rx="4" fill="url(#cab)" filter="url(#shadow)"/>
  <rect x="105" y="95" width="150" height="140" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="240" cy="165" r="5" fill="#333"/>

  <rect x="290" y="80" width="220" height="170" rx="4" fill="url(#cab)" filter="url(#shadow)"/>
  <rect x="305" y="95" width="190" height="140" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="320" cy="165" r="5" fill="#333"/>
  <circle cx="480" cy="165" r="5" fill="#333"/>

  <rect x="530" y="80" width="180" height="170" rx="4" fill="url(#cab)" filter="url(#shadow)"/>
  <rect x="545" y="95" width="150" height="140" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="560" cy="165" r="5" fill="#333"/>

  <!-- Countertop -->
  <rect x="75" y="360" width="650" height="20" rx="3" fill="#111" stroke="#444" stroke-width="1"/>

  <!-- Lower Cabinets -->
  <rect x="90" y="380" width="280" height="140" rx="4" fill="url(#cab)" filter="url(#shadow)"/>
  <rect x="105" y="395" width="250" height="110" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="215" y="415" width="30" height="6" rx="2" fill="#333"/>

  <rect x="430" y="380" width="280" height="140" rx="4" fill="url(#cab)" filter="url(#shadow)"/>
  <rect x="445" y="395" width="250" height="110" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="555" y="415" width="30" height="6" rx="2" fill="#333"/>

  <!-- Badge banner -->
  <rect x="240" y="520" width="320" height="42" rx="21" fill="url(#gold)"/>
  <text x="400" y="547" fill="#000" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">KITCHEN CABINET REFINISHING</text>
</svg>
