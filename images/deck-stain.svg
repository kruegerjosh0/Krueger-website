<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192027"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
    <linearGradient id="woodRich" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="50%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#6b3410"/>
    </linearGradient>
    <linearGradient id="woodAged" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#696969"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd53d"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <filter id="deckShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Deck Planks -->
  <g filter="url(#deckShadow)">
    <!-- Weathered left half, freshly stained right half comparison -->
    <!-- Plank 1 -->
    <rect x="70" y="80" width="320" height="65" rx="3" fill="url(#woodAged)"/>
    <rect x="395" y="80" width="335" height="65" rx="3" fill="url(#woodRich)"/>
    
    <!-- Plank 2 -->
    <rect x="70" y="155" width="320" height="65" rx="3" fill="url(#woodAged)"/>
    <rect x="395" y="155" width="335" height="65" rx="3" fill="url(#woodRich)"/>

    <!-- Plank 3 -->
    <rect x="70" y="230" width="320" height="65" rx="3" fill="url(#woodAged)"/>
    <rect x="395" y="230" width="335" height="65" rx="3" fill="url(#woodRich)"/>

    <!-- Plank 4 -->
    <rect x="70" y="305" width="320" height="65" rx="3" fill="url(#woodAged)"/>
    <rect x="395" y="305" width="335" height="65" rx="3" fill="url(#woodRich)"/>

    <!-- Plank 5 -->
    <rect x="70" y="380" width="320" height="65" rx="3" fill="url(#woodAged)"/>
    <rect x="395" y="380" width="335" height="65" rx="3" fill="url(#woodRich)"/>
  </g>

  <!-- Labels on comparison -->
  <rect x="140" y="240" width="180" height="40" rx="4" fill="#000" opacity="0.75"/>
  <text x="230" y="265" fill="#fff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">WEATHERED CEDAR</text>

  <rect x="470" y="240" width="180" height="40" rx="4" fill="#000" opacity="0.75"/>
  <text x="560" y="265" fill="#ffd53d" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">FRESHLY RESTORED &amp; STAINED</text>

  <!-- Divider Line -->
  <line x1="392" y1="70" x2="392" y2="455" stroke="#ffd53d" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Badge banner -->
  <rect x="220" y="520" width="360" height="42" rx="21" fill="url(#gold3)"/>
  <text x="400" y="547" fill="#000" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">DECK RESTORATION &amp; WEATHER SEAL</text>
</svg>
