<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3035"/>
      <stop offset="100%" stop-color="#181b1e"/>
    </linearGradient>
    <linearGradient id="mud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4d4cb"/>
      <stop offset="50%" stop-color="#ebebe3"/>
      <stop offset="100%" stop-color="#c9c9be"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd53d"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <filter id="wallShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Wall Board Section -->
  <rect x="70" y="60" width="660" height="460" rx="6" fill="#a49e91" filter="url(#wallShadow)"/>

  <!-- Drywall Joint / Seam -->
  <line x1="400" y1="60" x2="400" y2="520" stroke="#7e786b" stroke-width="6"/>

  <!-- Mud and Tape Layer (Feathered Edge) -->
  <polygon points="340,60 460,60 450,520 350,520" fill="url(#mud)" opacity="0.95"/>
  <line x1="395" y1="80" x2="395" y2="500" stroke="#fcfcf9" stroke-width="4" stroke-dasharray="10 4" opacity="0.8"/>

  <!-- Screw Patches Mudded -->
  <circle cx="220" cy="150" r="18" fill="url(#mud)"/>
  <circle cx="220" cy="300" r="16" fill="url(#mud)"/>
  <circle cx="220" cy="450" r="17" fill="url(#mud)"/>

  <circle cx="580" cy="180" r="16" fill="url(#mud)"/>
  <circle cx="580" cy="330" r="18" fill="url(#mud)"/>
  <circle cx="580" cy="460" r="15" fill="url(#mud)"/>

  <!-- Trowel/Knife Illustration -->
  <g transform="translate(420, 260) rotate(-25)">
    <polygon points="0,0 120,-10 130,40 10,50" fill="#ced4da" stroke="#adb5bd" stroke-width="2"/>
    <rect x="-40" y="15" width="45" height="18" rx="4" fill="#343a40"/>
    <line x1="5" y1="18" x2="115" y2="8" stroke="#f8f9fa" stroke-width="2"/>
  </g>

  <!-- Badge banner -->
  <rect x="230" y="520" width="340" height="42" rx="21" fill="url(#gold2)"/>
  <text x="400" y="547" fill="#000" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">SEAMLESS DRYWALL MUD &amp; TAPE</text>
</svg>
